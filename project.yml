name: Vela
options:
  bundleIdPrefix: cd.cc
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "255R6QQR97"
    CODE_SIGN_STYLE: Automatic
targets:
  Vela:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
      - path: Maren.storekit
        buildPhase: none
    dependencies:
      - target: VelaWidgetExtension
        embed: true
      - target: VelaWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
    entitlements:
      path: Vela/Vela.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cd.cc.vela
        # CloudKit 私有库同步(V2):数据存用户自己的 iCloud,我们的服务器零接触。
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cd.cc.vela
        com.apple.developer.icloud-services:
          - CloudKit
        # HealthKit(经期数据双向同步)。真机需在该 App ID 勾 HealthKit capability;模拟器可直接跑。
        com.apple.developer.healthkit: true
    info:
      path: Vela/Info.plist
      properties:
        CFBundleDisplayName: Maren
        # 版本号从 build settings 继承(MARKETING_VERSION / CURRENT_PROJECT_VERSION),
        # 与 Widget/Watch 保持一致 —— App Store 要求三端版本号一致。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 声明不使用非豁免加密,避免每次提审都要人工填出口合规问卷。
        ITSAppUsesNonExemptEncryption: false
        # 声明实际支持的语言。英文作为开发/回退语言:
        # 法语、德语等未翻译的系统语言会回退到英文,而不是中文。
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSFaceIDUsageDescription: "Use Face ID to unlock Maren so only you can see your health records."
        # Apple Health 双向同步的用途说明(HealthKit capability 已在上面 entitlements 启用)。
        NSHealthShareUsageDescription: "Read period entries from Apple Health to import your existing data into Maren. Used only on your device — never shared."
        NSHealthUpdateUsageDescription: "Write the periods you log in Maren back to Apple Health so other apps can use them. Used only on your device — never shared."
        # Widget 深链接:点 widget 的「进今天/进日历」打开对应页面。
        # 与 WidgetSources/VelaWidget.swift 的 widgetURL(maren://today | maren://calendar)、
        # Sources/Views/RootView.swift 的 onOpenURL 处理逻辑配套。
        CFBundleURLTypes:
          - CFBundleURLName: cd.cc.vela
            CFBundleURLSchemes:
              - maren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: en

  VelaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Shared
      - path: Resources/Localizable.xcstrings
    entitlements:
      path: WidgetSources/VelaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cd.cc.vela
    info:
      path: WidgetSources/Info.plist
      properties:
        CFBundleDisplayName: Maren
        # 版本号从主 app 的 build settings 继承,避免 extension 与主 app 不一致(App Store 必拒)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  VelaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchSources
      - path: Shared
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela.watchkitapp
        # 让 Xcode 生成 Info.plist:手动 plist 里的 UIDeviceFamily 会被构建流程覆盖成 iOS 的 (1,2),
        # 用生成方式 + INFOPLIST_KEY_* 才能正确写入 watchOS 设备家族。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maren
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cd.cc.vela
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  Vela:
    build:
      targets:
        Vela: all
    run:
      config: Debug
      storeKitConfiguration: Maren.storekit
    test:
      config: Debug
    archive:
      config: Release
