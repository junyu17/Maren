name: Vela
options:
  bundleIdPrefix: cd.cc
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  # The source strings are Simplified Chinese and the catalog declares the
  # same source locale. English is a complete translated localization, so an
  # English device resolves to the en catalog with a consistent UI language.
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: "255R6QQR97"
    CODE_SIGN_STYLE: Automatic
targets:
  Vela:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
      - path: Maren.storekit
        buildPhase: none
    dependencies:
      - target: VelaWidgetExtension
        embed: true
      - target: VelaWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
    entitlements:
      path: Vela/Vela.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cd.cc.vela
        # ⚠️ 不启用 iCloud / CloudKit:App Review Guideline 5.1.3(ii) 禁止把个人健康信息存入 iCloud。
        # 健康数据只存本机 SwiftData 本地库。
        # HealthKit(经期数据双向同步)。真机需在该 App ID 勾 HealthKit capability;模拟器可直接跑。
        com.apple.developer.healthkit: true
    info:
      path: Vela/Info.plist
      properties:
        CFBundleDisplayName: Maren
        CFBundleName: Maren
        # 版本号从 build settings 继承(MARKETING_VERSION / CURRENT_PROJECT_VERSION),
        # 与 Widget/Watch 保持一致 —— App Store 要求三端版本号一致。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 声明不使用非豁免加密,避免每次提审都要人工填出口合规问卷。
        ITSAppUsesNonExemptEncryption: false
        # 声明实际支持的语言。简体中文是开发/源语言；英文由完整的 en
        # catalog 提供。其他未翻译的系统语言按 Apple 语言回退规则选择可用本地化。
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSFaceIDUsageDescription: "Use Face ID to unlock Maren so only you can see your health records."
        # Apple Health 双向同步的用途说明(HealthKit capability 已在上面 entitlements 启用)。
        NSHealthShareUsageDescription: "Read menstrual flow, body mass, sleep analysis, basal body temperature, intermenstrual bleeding, step count, and Apple exercise time from Apple Health to import selected records into Maren. Sleep analysis, step count, and Apple exercise time are read-only. Optional and used only on this device; never sent to a developer server."
        NSHealthUpdateUsageDescription: "Write the menstrual flow, body mass, basal body temperature, and intermenstrual bleeding you record in Maren to Apple Health when you choose to sync them. Sleep analysis, step count, and Apple exercise time are read-only and are never written to Apple Health. Optional and used only on this device; never sent to a developer server."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: cd.cc.vela.encrypted-backup
            UTTypeDescription: "Maren Encrypted Backup"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - marenbackup
        # Widget 深链接:点 widget 的「进今天/进日历」打开对应页面。
        # 与 WidgetSources/VelaWidget.swift 的 widgetURL(maren://today | maren://calendar)、
        # Sources/Views/RootView.swift 的 onOpenURL 处理逻辑配套。
        CFBundleURLTypes:
          - CFBundleURLName: cd.cc.vela
            CFBundleURLSchemes:
              - maren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: zh-Hans

  VelaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Shared
      - path: Resources/Localizable.xcstrings
    entitlements:
      path: WidgetSources/VelaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cd.cc.vela
    info:
      path: WidgetSources/Info.plist
      properties:
        CFBundleDisplayName: Maren
        # 版本号从主 app 的 build settings 继承,避免 extension 与主 app 不一致(App Store 必拒)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  VelaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchSources
      - path: Shared
      - path: Resources/Localizable.xcstrings
    dependencies:
      - target: VelaWatchWidgetExtension
        embed: true
    entitlements:
      path: WatchSources/VelaWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cd.cc.vela
    info:
      path: WatchSources/Info.plist
      properties:
        CFBundleDisplayName: Maren
        CFBundleName: Maren
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: cd.cc.vela
        CFBundleURLTypes:
          - CFBundleURLName: cd.cc.vela.watch
            CFBundleURLSchemes:
              - marenwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela.watchkitapp
        # ⚠️ Watch app 必须有自己的 asset catalog + AppIcon。
        # 主 app 的 Resources/Assets.xcassets 里 AppIcon 的 platform 是 "ios",
        # 就算把它加进 watch target 也生成不出 watchOS 图标。缺图标时:
        #   - Archive 上传报 90391 "No icons found for watch application"
        #   - 以及 90713 "CFBundleIconName is missing in the bundle cd.cc.vela.watchkitapp"
        # (真机 Debug 构建不校验这两项,所以本地跑得起来、一上传就挂。)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  VelaWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgetSources
      - path: Shared
      - path: Resources/Localizable.xcstrings
    entitlements:
      path: WatchWidgetSources/WatchVelaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cd.cc.vela
    info:
      path: WatchWidgetSources/Info.plist
      properties:
        CFBundleDisplayName: Maren
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_LANGUAGE: zh-Hans

  VelaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VelaTests
    dependencies:
      - target: Vela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cd.cc.vela.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vela.app/Vela"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Vela:
    build:
      targets:
        Vela: all
        VelaTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Maren.storekit
    test:
      config: Debug
      targets:
        - VelaTests
    archive:
      config: Release
  VelaWatch:
    build:
      targets:
        VelaWatch: all
    run:
      config: Debug
    archive:
      config: Release
